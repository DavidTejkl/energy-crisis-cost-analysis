# Purpose: when a push changes code or inputs, rebuild the Python part of the pipeline on a clean machine and prove it is
# reproducible: download the raw files, clean them, generate the simulated load and compare the SHA-256
# of every silver file with the reference in tests/silver_checksums.sha256.
# The SQL Server part runs locally only (no database on the build machine), see README.

name: pipeline-check

# Runs only when a push changes something that can change the data (code, tariffs, dependencies,
# reference checksums or this file); README, docs and SQL changes do not start it.
# workflow_dispatch = it can also be started by hand on the Actions tab.
on:
  push:
    branches: [main]
    paths:
      - "python/**"
      - "config/**"
      - "requirements.txt"
      - "tests/**"
      - ".github/workflows/pipeline-check.yml"
  workflow_dispatch:

jobs:
  python-pipeline:
    # Windows, the same OS as the reference run: CSV line endings, and so the checksums, depend on it.
    runs-on: windows-latest
    # The runner console uses cp1252, which cannot print Czech letters (e.g. "Č"); UTF-8 mode fixes print().
    env:
      PYTHONUTF8: "1"
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pinned dependencies
        run: pip install -r requirements.txt

      - name: Download raw files (bronze)
        run: python python/01_extract.py

      - name: Clean the data (silver)
        run: python python/02_transform.py

      - name: Generate the simulated load profile
        run: python python/04_generate_load_profile.py

      # git on Windows checks the file out with CRLF line endings; tr removes the \r so sha256sum
      # reads the file names correctly.
      - name: Compare silver files with the reference checksums
        run: tr -d '\r' < tests/silver_checksums.sha256 | sha256sum -c

      - name: Cross-check exchange rates against the ČNB REST API
        run: python python/05_check_fx_api.py
